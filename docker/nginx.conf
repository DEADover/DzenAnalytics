server {
    listen ${NGINX_PORT};
    root /var/www/html;
    index index.html;

    # Внимание: add_header внутри location отменяет все add_header уровнем
    # выше, поэтому заголовки безопасности повторены в каждом location.

    # Файлы сборки с хешем в имени не меняются никогда — кеш на год.
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        # Без always: ответ 404 (файла прошлой версии нет) кешироваться не должен.
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Всё остальное — страница, service worker (sw.js), манифест, иконки — с
    # проверкой свежести при каждом заходе: ответ «не изменилось» (304) почти
    # ничего не стоит. Раньше sw.js кешировался на год как «неизменяемый», а
    # у index.html заголовка не было вовсе — браузер сам решал, сколько держать
    # старую страницу со ссылками на файлы прошлой версии.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
    }
}
