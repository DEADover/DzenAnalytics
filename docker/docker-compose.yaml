name: dzenanalytics
services:
  dzenanalitics:
    # `up -d` берёт готовый образ из релиза, `up -d --build` собирает его из
    # исходников по `build` ниже.
    image: ghcr.io/deadover/dzenanalytics:latest
    build:
      context: ..
      dockerfile: docker/Dockerfile
    ports:
      - ${LISTEN_PORT:-8000}:8000
    restart: unless-stopped
